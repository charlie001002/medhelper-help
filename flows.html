<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MedHelper — Architecture Flow Diagram</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0d1117;
  color: #c9d1d9;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#header {
  padding: 12px 20px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
#header h1 { font-size: 16px; font-weight: 600; color: #e6edf3; }
#header p  { font-size: 12px; color: #7d8590; }
#body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Left sidebar ──────────────────────────────── */
#sidebar {
  width: 190px;
  min-width: 190px;
  background: #161b22;
  border-right: 1px solid #30363d;
  padding: 14px 10px;
  overflow-y: auto;
  flex-shrink: 0;
}
#sidebar h4 {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #7d8590;
  padding: 0 6px;
  margin-bottom: 10px;
}
.flow-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  padding: 9px 10px;
  margin-bottom: 4px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: #8b949e;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  line-height: 1.3;
}
.flow-btn:hover { background: #21262d; color: #e6edf3; border-color: #30363d; }
.flow-btn.active {
  background: color-mix(in srgb, var(--fc) 18%, #21262d);
  border-color: var(--fc);
  color: #e6edf3;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--fc);
  flex-shrink: 0;
}
.sidebar-divider { border: none; border-top: 1px solid #30363d; margin: 10px 6px; }

/* ── Diagram ───────────────────────────────────── */
#diagram-wrap {
  flex: 1;
  overflow: auto;
  padding: 16px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
#diagram {
  background: #0d1117;
  border-radius: 10px;
  border: 1px solid #21262d;
  flex-shrink: 0;
}
.comp-rect {
  rx: 7;
  stroke-width: 1.5;
  fill: color-mix(in srgb, var(--lc) 14%, #161b22);
  stroke: color-mix(in srgb, var(--lc) 45%, #30363d);
  transition: opacity 0.25s, fill 0.25s, stroke 0.25s;
}
.comp-label {
  font-size: 10.5px;
  font-weight: 600;
  text-anchor: middle;
  dominant-baseline: middle;
  fill: #c9d1d9;
  pointer-events: none;
  transition: opacity 0.25s;
}
.comp-sublabel {
  font-size: 9px;
  text-anchor: middle;
  dominant-baseline: middle;
  fill: #6e7681;
  pointer-events: none;
  transition: opacity 0.25s;
}
.layer-strip {
  rx: 4;
  fill: color-mix(in srgb, var(--lc) 7%, #0d1117);
  stroke: color-mix(in srgb, var(--lc) 20%, #0d1117);
  stroke-width: 1;
}
.layer-lbl {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.9px;
  text-transform: uppercase;
  text-anchor: start;
  fill: color-mix(in srgb, var(--lc) 60%, #6e7681);
}
.comp-g { cursor: default; }
.comp-g.dimmed .comp-rect  { opacity: 0.12; }
.comp-g.dimmed .comp-label { opacity: 0.12; }
.comp-g.dimmed .comp-sublabel { opacity: 0.12; }
.comp-g.active .comp-rect  {
  fill: color-mix(in srgb, var(--lc) 28%, #161b22);
  stroke: var(--lc);
  stroke-width: 2;
}
.flow-path { fill: none; stroke-width: 2; opacity: 0; transition: opacity 0.3s; }
.flow-path.show { opacity: 1; }
.step-bubble { opacity: 0; transition: opacity 0.3s; }
.step-bubble.show { opacity: 1; }
.step-text {
  font-size: 8.5px; font-weight: 700; text-anchor: middle;
  dominant-baseline: middle; fill: #0d1117; pointer-events: none;
}
.arrow-lbl {
  font-size: 9px; text-anchor: middle; dominant-baseline: middle;
  opacity: 0; transition: opacity 0.3s; cursor: default;
  fill: #c9d1d9;
}
.arrow-lbl.show { opacity: 1; }

/* ── Right panel ───────────────────────────────── */
#step-panel {
  width: 310px;
  min-width: 310px;
  background: #161b22;
  border-left: 1px solid #30363d;
  padding: 14px 14px;
  overflow-y: auto;
  flex-shrink: 0;
}
#panel-title {
  font-size: 13px; font-weight: 600; color: #e6edf3;
  margin-bottom: 4px;
}
#panel-desc {
  font-size: 11px; color: #7d8590; margin-bottom: 14px; line-height: 1.5;
}
.step-card {
  padding: 9px 11px;
  margin-bottom: 7px;
  background: #21262d;
  border-radius: 7px;
  border-left: 3px solid #30363d;
  cursor: pointer;
  transition: all 0.15s;
}
.step-card:hover { background: #2d333b; }
.step-card.hi {
  border-left-color: var(--fc);
  background: color-mix(in srgb, var(--fc) 14%, #21262d);
}
.step-n {
  font-size: 9px; font-weight: 700; letter-spacing: 0.6px;
  text-transform: uppercase; color: #7d8590; margin-bottom: 3px;
}
.step-route {
  font-size: 11px; font-weight: 600; color: #e6edf3; margin-bottom: 3px;
}
.step-route .sep { color: #484f58; }
.step-method {
  font-size: 10.5px; font-family: 'SF Mono', 'Fira Code', monospace;
  color: #79c0ff; margin-bottom: 3px;
}
.step-ann { font-size: 10.5px; color: #8b949e; line-height: 1.4; }
#empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; gap: 10px;
  color: #484f58; font-size: 12px; text-align: center;
}

/* ── Legend ────────────────────────────────────── */
#legend {
  display: flex; gap: 18px; padding: 9px 20px;
  background: #161b22; border-top: 1px solid #30363d;
  flex-wrap: wrap; flex-shrink: 0;
}
.leg { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #7d8590; }
.leg-sq { width: 10px; height: 10px; border-radius: 3px; }
</style>
</head>

// ═══════════════════════════════════════════════════════════════════
// RENDER ENGINE
// ═══════════════════════════════════════════════════════════════════
const BW = 120, BH = 42;
const SVG_NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("diagram");
let activeFlow = null;

// Layer colour lookup
function layerColor(layerId) {
  return DATA.layers.find(l => l.id === layerId)?.color || "#666";
}

// Create SVG element helper
function el(tag, attrs = {}, children = []) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  children.forEach(c => e.appendChild(c));
  return e;
}

// ── Build defs (arrowhead markers) ─────────────────────────────────
function buildDefs() {
  const defs = el("defs");
  const colors = [...new Set(Object.values(DATA.flows).map(f => f.color))];
  colors.forEach(c => {
    const marker = el("marker", {
      id: "arrowhead-" + c.replace("#",""),
      markerWidth:"10", markerHeight:"7",
      refX:"9", refY:"3.5", orient:"auto"
    });
    marker.appendChild(el("polygon", { points:"0 0,10 3.5,0 7", fill: c }));
    defs.appendChild(marker);
  });
  svg.appendChild(defs);
}

// ── Draw layer strips ───────────────────────────────────────────────
function buildLayers() {
  DATA.layers.forEach(layer => {
    const g = el("g");
    g.style.setProperty("--lc", layer.color);
    g.appendChild(el("rect", {
      class:"layer-strip", x:4, y:layer.y, width:1052, height:layer.h
    }));
    g.appendChild(Object.assign(document.createElementNS(SVG_NS,"text"), {
      className:"layer-lbl"
    }));
    const txt = el("text", { class:"layer-lbl", x:10, y: layer.y + layer.h - 8 });
    txt.style.setProperty("--lc", layer.color);
    txt.textContent = layer.label;
    g.appendChild(txt);
    svg.appendChild(g);
  });
}

// ── Draw component boxes ────────────────────────────────────────────
function buildComponents() {
  Object.entries(DATA.components).forEach(([id, comp]) => {
    const lc = layerColor(comp.layer);
    const g = el("g", { id:"comp-"+id, class:"comp-g", "data-id":id });
    g.style.setProperty("--lc", lc);

    g.appendChild(el("rect", {
      class:"comp-rect", x:comp.x, y:comp.y, width:BW, height:BH
    }));

    const hasSubLabel = comp.sub && comp.sub.length;
    const mainY = comp.y + (hasSubLabel ? BH*0.38 : BH*0.5);
    const lbl = el("text", { class:"comp-label", x: comp.x + BW/2, y: mainY });
    lbl.textContent = comp.label;
    g.appendChild(lbl);

    if (hasSubLabel) {
      const sub = el("text", { class:"comp-sublabel", x: comp.x + BW/2, y: comp.y + BH*0.68 });
      sub.textContent = comp.sub;
      g.appendChild(sub);
    }

    svg.appendChild(g);
  });
}

// ── Arrow path calculation ──────────────────────────────────────────
function anchorPoints(from, to, offsetX) {
  const fc = DATA.components[from];
  const tc = DATA.components[to];
  if (!fc || !tc) return null;

  // same component (self-loop): skip
  if (from === to) return null;

  const fx = fc.x + BW/2 + offsetX;
  const tx = tc.x + BW/2 + offsetX;
  const sameRow = Math.abs(fc.y - tc.y) < 10;

  if (sameRow) {
    const goRight = tc.x > fc.x;
    const sx = goRight ? fc.x + BW : fc.x;
    const ex = goRight ? tc.x      : tc.x + BW;
    const my = fc.y + BH/2;
    const cpx = (sx + ex) / 2;
    return { path:`M ${sx} ${my} C ${cpx} ${my-22} ${cpx} ${my+22} ${ex} ${my}`, mx:(sx+ex)/2, my };
  }

  const goingDown = tc.y > fc.y;
  const sy = goingDown ? fc.y + BH : fc.y;
  const ey = goingDown ? tc.y      : tc.y + BH;
  const midY = (sy + ey) / 2;
  return { path:`M ${fx} ${sy} C ${fx} ${midY} ${tx} ${midY} ${tx} ${ey}`, mx:(fx+tx)/2, my:midY };
}

// ── Render a flow ───────────────────────────────────────────────────
// Arrows group sits under components
const arrowLayer = el("g", { id:"arrow-layer" });
svg.insertBefore(arrowLayer, svg.firstChild?.nextSibling || null);

function clearFlow() {
  arrowLayer.innerHTML = "";
  document.querySelectorAll(".comp-g").forEach(g => {
    g.classList.remove("active","dimmed");
  });
  document.querySelectorAll(".step-card").forEach(c => c.classList.remove("hi"));
}

function renderFlow(flowId) {
  clearFlow();
  if (!flowId || !DATA.flows[flowId]) return;

  const flow = DATA.flows[flowId];
  const fc = flow.color;

  // Collect active component ids
  const activeIds = new Set();
  flow.steps.forEach(s => { activeIds.add(s.from); activeIds.add(s.to); });

  // Dim/highlight components
  document.querySelectorAll(".comp-g").forEach(g => {
    const id = g.getAttribute("data-id");
    if (activeIds.has(id)) g.classList.add("active");
    else g.classList.add("dimmed");
  });

  // Track pair offsets for duplicate from-to
  const pairCount = {};
  flow.steps.forEach(s => {
    const key = s.from + ">" + s.to;
    pairCount[key] = (pairCount[key] || 0) + 1;
  });
  const pairIndex = {};

  // Draw arrows
  flow.steps.forEach((step, i) => {
    const key = step.from + ">" + step.to;
    pairIndex[key] = (pairIndex[key] || 0);
    const count = pairCount[key];
    const offsetX = count > 1 ? (pairIndex[key] - (count-1)/2) * 14 : 0;
    pairIndex[key]++;

    const anc = anchorPoints(step.from, step.to, offsetX);
    if (!anc) return;

    const path = el("path", {
      class:"flow-path",
      d: anc.path,
      stroke: fc,
      "stroke-dasharray": "none",
      "marker-end": `url(#arrowhead-${fc.replace("#","")})`
    });
    arrowLayer.appendChild(path);
    requestAnimationFrame(() => path.classList.add("show"));

    // Step number badge
    const badge = el("g", { class:"step-bubble", "data-step":i });
    badge.appendChild(el("circle", { cx: anc.mx, cy: anc.my, r:9, fill: fc }));
    const num = el("text", { class:"step-text", x: anc.mx, y: anc.my });
    num.textContent = i + 1;
    badge.appendChild(num);
    arrowLayer.appendChild(badge);
    requestAnimationFrame(() => badge.classList.add("show"));

    // Method label (shown near midpoint, offset slightly)
    const lbl = el("text", {
      class:"arrow-lbl",
      x: anc.mx,
      y: anc.my - 14,
      fill: fc
    });
    lbl.textContent = step.method;
    arrowLayer.appendChild(lbl);
    requestAnimationFrame(() => lbl.classList.add("show"));
  });
}

// ── Build sidebar buttons ───────────────────────────────────────────
function buildSidebar() {
  const container = document.getElementById("flow-btns");
  Object.entries(DATA.flows).forEach(([id, flow]) => {
    const btn = document.createElement("button");
    btn.className = "flow-btn";
    btn.setAttribute("data-flow", id);
    btn.style.setProperty("--fc", flow.color);
    btn.innerHTML = `<span class="dot"></span>${flow.label}`;
    btn.addEventListener("click", () => selectFlow(id));
    container.appendChild(btn);
  });
}

// ── Build step panel ────────────────────────────────────────────────
function buildStepPanel(flowId) {
  const flow = DATA.flows[flowId];
  const fc = flow.color;

  document.getElementById("empty-state").style.display = "none";
  const content = document.getElementById("panel-content");
  content.style.display = "block";
  content.style.setProperty("--fc", fc);

  document.getElementById("panel-title").textContent = flow.label;
  document.getElementById("panel-title").style.color = fc;
  document.getElementById("panel-desc").textContent = flow.desc;

  const list = document.getElementById("steps-list");
  list.innerHTML = "";

  flow.steps.forEach((step, i) => {
    const fc_ = DATA.components[step.from];
    const tc_ = DATA.components[step.to];
    const fromLabel = (fc_?.label || step.from) + (fc_?.sub ? " " + fc_.sub : "");
    const toLabel   = (tc_?.label || step.to)   + (tc_?.sub ? " " + tc_.sub   : "");

    const card = document.createElement("div");
    card.className = "step-card";
    card.setAttribute("data-step", i);
    card.style.setProperty("--fc", fc);
    card.innerHTML = `
      <div class="step-n">Step ${i+1}</div>
      <div class="step-route">
        ${fromLabel} <span class="sep">→</span> ${toLabel}
      </div>
      <div class="step-method">${step.method}</div>
      <div class="step-ann">${step.ann}</div>
    `;
    card.addEventListener("mouseenter", () => {
      document.querySelectorAll(".step-card").forEach(c => c.classList.remove("hi"));
      card.classList.add("hi");
    });
    list.appendChild(card);
  });
}

// ── Select a flow ───────────────────────────────────────────────────
function selectFlow(flowId) {
  if (activeFlow === flowId) {
    activeFlow = null;
    clearFlow();
    document.querySelectorAll(".flow-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("empty-state").style.display = "flex";
    document.getElementById("panel-content").style.display = "none";
    return;
  }
  activeFlow = flowId;
  document.querySelectorAll(".flow-btn").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-flow") === flowId);
  });
  renderFlow(flowId);
  buildStepPanel(flowId);
}

// ── Init ────────────────────────────────────────────────────────────
buildDefs();
buildLayers();

// Insert arrow layer after defs
svg.appendChild(arrowLayer);

buildComponents();
buildSidebar();
</script>
</body>
</html>
